# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # La URL del Apps Script no está en el repo: se toma del secreto RSVP_API_URL
      # (Settings → Secrets and variables → Actions) y se escribe en los .html al publicar.
      - name: Insert RSVP API URL
        env:
          RSVP_API_URL: ${{ secrets.RSVP_API_URL }}
        run: |
          if [ -z "$RSVP_API_URL" ]; then echo "::error::Falta el secreto RSVP_API_URL"; exit 1; fi
          for f in *.html; do sed -i "s#__RSVP_API_URL__#${RSVP_API_URL}#g" "$f"; done
          grep -l "__RSVP_API_URL__" *.html && { echo "::error::Quedó __RSVP_API_URL__ sin reemplazar"; exit 1; } || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
